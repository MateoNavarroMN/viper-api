<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 90 220 220" fill="none">
  <!-- Contorno principal engrosado para que se vea en miniatura -->
  <circle cx="200" cy="200" r="100" stroke="#10B981" stroke-width="16" />
  
  <!-- Línea curva izquierda calculada milimétricamente -->
  <path d="M 129.3 129.3 Q 200 200 129.3 270.7" stroke="#10B981" stroke-width="16" stroke-linecap="round" />
  
  <!-- Línea curva derecha -->
  <path d="M 270.7 129.3 Q 200 200 270.7 270.7" stroke="#10B981" stroke-width="16" stroke-linecap="round" />
</svg>
